<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Relo</title>
  <meta name="description" content="A private, visual workspace for the people, brands, tools, and opportunities you want to follow up with.">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="app.css">
  <script>
    try { const t = localStorage.getItem('relo-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
    <main class="main">
      <header class="topbar" id="topbar"></header>
      <div id="banner"></div>
      <div class="view" id="view" tabindex="-1"></div>
    </main>
  </div>
  <div id="overlays"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announcer" aria-live="assertive"></div>
  <noscript><p style="padding:24px">Relo needs JavaScript to run. Your data stays in this browser.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
